<style>
  :root{
    --bg:#EBEFF6; --card:#FFFFFF; --navy:#152744; --steel:#4C6690; --faint:#6B7A96;
    --line:#D5DDEA; --grid:#E3E9F2; --yellow:#F2B233; --gold:#B07A12;
    --yellowSoft:#FCEED0; --amber:#B5701A; --amberSoft:#F6E6CD;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--navy);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));}
  .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.03;margin:2px 0 0}
  .eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .sub{color:var(--faint);font-size:14px;line-height:1.5;margin:8px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
  .h2{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .muted{color:var(--faint)} .sm{font-size:12px} .xs{font-size:11px}
  input{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;
    font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--navy)}
  input:focus{outline:2px solid var(--navy);border-color:transparent}
  label{font-size:12px;color:var(--faint);display:block}
  label input{margin-top:4px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;font-weight:600;font-size:14px;
    padding:10px 16px;cursor:pointer}
  .btn2{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:9px;font-weight:600;
    font-size:13px;padding:9px 14px;cursor:pointer}
  .link{background:none;border:none;color:var(--faint);text-decoration:underline;font-size:12px;cursor:pointer;padding:0}
  .seg{display:flex;background:var(--bg);border-radius:9px;padding:3px}
  .seg button{border:none;background:none;color:var(--faint);font-family:ui-monospace,Menlo,monospace;
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff}
  .rings{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-top:6px}
  .ring{display:flex;flex-direction:column;align-items:center;width:80px}
  .rlab{font-size:12px;font-weight:600;margin-top:4px} .rdet{font-size:11px;color:var(--faint)}
  .scorebox{text-align:center;min-width:92px}
  .scoreN{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:42px;line-height:1}
  .bars{margin-top:10px} .barrow{margin-bottom:12px}
  .bartrack{background:var(--bg);border-radius:99px;height:7px;overflow:hidden;margin-top:5px}
  .barfill{height:100%}
  .pill{background:var(--yellowSoft);color:var(--navy);border:1px solid var(--yellow);
    border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .li{display:flex;align-items:center;justify-content:space-between;font-size:14px;
    padding:7px 0;border-bottom:1px solid var(--line)}
  .x{background:none;border:none;color:var(--amber);font-size:16px;cursor:pointer;margin-left:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--bg);border-radius:10px;padding:9px 8px;text-align:center}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
  .stat .v{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:16px;margin-top:3px}
  .guiddot{width:9px;height:9px;border-radius:99px;display:inline-block}
  .strip{display:flex;gap:4px;margin-top:8px}
  .cell{flex:1;text-align:center}
  .cellbar{height:26px;border-radius:4px}

  th{color:var(--faint);font-weight:600;text-align:right;padding:4px 6px}

  .foot{color:var(--faint);font-size:11px;text-align:center;line-height:1.5;margin:22px auto 0;max-width:460px}

  header{padding-right:56px}
  .menuBtn{position:fixed;z-index:90;top:max(14px,env(safe-area-inset-top));
    right:max(14px,calc((100vw - 640px)/2 + 14px));width:44px;height:44px;border:0;border-radius:12px;
    background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 7px 22px rgba(21,39,68,.24);cursor:pointer}
  .menuBtn svg{width:22px;height:22px}
  .drawerOverlay{position:fixed;inset:0;z-index:100;background:rgba(21,39,68,.42);opacity:0;
    pointer-events:none;transition:opacity .2s ease}

    padding:max(18px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));

  .drawer.open{transform:translateX(0)}

  .drawerHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}

  .drawerSection{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
  .macro5{margin-top:9px}

  .macroDate{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:650}
  .macroDate small{display:block;color:var(--faint);font-weight:400;font-size:10px;margin-top:1px}
  .sideStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}

  .sideStat .v{font-family:ui-monospace,Menlo,monospace;font-weight:750;font-size:17px;margin-top:3px}

  .recipeName{font-size:14px;font-weight:700;overflow-wrap:anywhere}

    font-size:12px;padding:8px 10px;cursor:pointer}

    max-width:min(88vw,420px);transform:translate(-50%,20px);background:var(--navy);color:#fff;
    border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;box-shadow:0 8px 26px rgba(21,39,68,.25);
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:480px){

  }
  @media(max-width:680px){
    .menuBtn{right:14px}
  }
  .hide{display:none}
</style>
</head>
<body>
<button class="menuBtn" id="menuBtn" type="button" aria-label="Open nutrition menu" aria-controls="sideDrawer" aria-expanded="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<div class="drawerOverlay" id="drawerOverlay"></div>
<aside class="drawer" id="sideDrawer" aria-hidden="true" aria-label="Nutrition overview and saved recipes">
  <div class="drawerHead">
    <div><div class="eyebrow mono">Nutrition menu</div><div class="drawerTitle">Recent intake</div></div>
    <button class="drawerClose" id="drawerClose" type="button" aria-label="Close menu">&times;</button>
  </div>
  <section class="drawerSection">
    <h2 class="h2">Last 5 days</h2>
    <div id="sideLast5"></div>
  </section>
  <section class="drawerSection">
    <h2 class="h2">5-day stats</h2>
    <div id="sideStats"></div>
  </section>
  <section class="drawerSection">
    <div class="row"><h2 class="h2">Saved recipes</h2><span class="xs muted" id="recipeCount"></span></div>
    <div id="sideRecipes"></div>
  </section>
</aside>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---- config --------------------------------------------------------------
var HEIGHT=182, AGE=39, START_WEIGHT=73;
var WTHR_TARGET=0.5;
var MAX_DEFICIT=500, WEIGHT_FLOOR=70, ABS_FLOOR=1900;  // safety limits
var FIELDS=[
  {k:"weight",l:"Weight",u:"kg"},{k:"waist",l:"Waist",u:"cm"},{k:"chest",l:"Chest",u:"cm"},
  {k:"hips",l:"Hips",u:"cm"},{k:"arm",l:"Arm",u:"cm"},{k:"thigh",l:"Thigh",u:"cm"}
];
var QUICK=[{name:"Protein shake",p:30,c:4,f:2},{name:"Eggs x3",p:19,c:1,f:15},{name:"Chicken 150g",p:46,c:0,f:5}];

// ---- state / storage -----------------------------------------------------
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
var meas=load("rt_meas",[]), nutri=load("rt_nutri",{}), preset=load("rt_preset","deficit");
var adj=load("rt_adj",{deficit:150,lastChangeDate:null});
var recipes=normaliseRecipes(load("rt_recipes",[]));
if(typeof adj.deficit!=="number") adj.deficit=150;
function persist(){localStorage.setItem("rt_meas",JSON.stringify(meas));
  localStorage.setItem("rt_nutri",JSON.stringify(nutri));localStorage.setItem("rt_preset",preset);
  localStorage.setItem("rt_adj",JSON.stringify(adj));localStorage.setItem("rt_recipes",JSON.stringify(recipes));}

// ---- helpers -------------------------------------------------------------
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function fmt(n){return (n==null||n===""||isNaN(n))?"\u2014":Number(n).toFixed(1);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function localDay(off){var d=new Date();if(off)d.setDate(d.getDate()-off);
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function today(){return localDay(0);}
function currentWeight(){var e=sortedMeas();for(var i=e.length-1;i>=0;i--){if(e[i].weight!=null)return e[i].weight;}return START_WEIGHT;}
function bmr(w){return Math.round(10*w+6.25*HEIGHT-5*AGE+5);}
function maintenance(){return Math.round(bmr(currentWeight())*1.5);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function targets(){
  var m=maintenance(), isCut=preset==="deficit";
  var f=isCut?70:75, p=150, kcal=isCut?(m-adj.deficit):m;
  var c=Math.round((kcal-p*4-f*9)/4);
  var label=isCut?"Mild fat loss":"Maintenance (recomp)";
  var blurb=isCut
    ?("~"+adj.deficit+" kcal under maintenance ("+m+"). Belly comes down; protein protects the muscle.")
    :"Weight holds, composition shifts. Slowest belly change, zero muscle risk.";
  return {kcal:kcal,p:p,c:c,f:f,maint:m,label:label,blurb:blurb};
}
function kcalOf(it){return it.p*4+it.c*4+it.f*9;}
function totals(items){return items.reduce(function(a,it){return {kcal:a.kcal+kcalOf(it),p:a.p+it.p,c:a.c+it.c,f:a.f+it.f};},{kcal:0,p:0,c:0,f:0});}
function scoreOf(t,tg){var sP=clamp(t.p/tg.p,0,1),sK=clamp(1-Math.abs(t.kcal-tg.kcal)/tg.kcal,0,1),
  sC=clamp(1-Math.abs(t.c-tg.c)/tg.c,0,1),sF=clamp(1-Math.abs(t.f-tg.f)/tg.f,0,1);
  return Math.round(100*(0.35*sP+0.30*sK+0.175*sC+0.175*sF));}
function sortedMeas(){return meas.slice().sort(function(a,b){return a.date.localeCompare(b.date);});}
function el(id){return document.getElementById(id);}
function normaliseRecipes(list){
  if(!Array.isArray(list)) return [];
  return list.filter(function(r){return r&&typeof r==="object";}).map(function(r,i){
    return {id:String(r.id||("legacy-"+i)),name:String(r.name||"Recipe"),p:+r.p||0,c:+r.c||0,f:+r.f||0};
  });
}
function foodFromInputs(){
  return {name:(el("nName").value||"").trim()||"Item",p:+el("nP").value||0,c:+el("nC").value||0,f:+el("nF").value||0};
}
function clearFoodInputs(){el("nName").value="";el("nP").value="";el("nC").value="";el("nF").value="";}
function addToToday(it,message){
  var t=today(); if(!nutri[t])nutri[t]={items:[]};
  nutri[t].items.push({name:String(it.name||"Item"),p:+it.p||0,c:+it.c||0,f:+it.f||0});
  persist(); updNutrition(); if(message)showToast(message);
}
var toastTimer=null;
function showToast(message){
  var t=el("toast"); if(!t)return; t.textContent=message; t.className="toast show";
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.className="toast";},2200);
}
function openDrawer(){
  updSidebar(); el("sideDrawer").classList.add("open");el("drawerOverlay").classList.add("open");
  el("sideDrawer").setAttribute("aria-hidden","false");el("menuBtn").setAttribute("aria-expanded","true");
  document.body.classList.add("drawer-open");setTimeout(function(){el("drawerClose").focus();},40);
}
function closeDrawer(){
  el("sideDrawer").classList.remove("open");el("drawerOverlay").classList.remove("open");
  el("sideDrawer").setAttribute("aria-hidden","true");el("menuBtn").setAttribute("aria-expanded","false");
  document.body.classList.remove("drawer-open");
}
function saveRecipeFromForm(){
  var rawName=(el("nName").value||"").trim(), it=foodFromInputs();
  if(!rawName){alert("Give the recipe a name first.");return;}
  if(!it.p&&!it.c&&!it.f){alert("Enter at least one macro value before saving the recipe.");return;}
  var found=null; for(var i=0;i<recipes.length;i++){if(recipes[i].name.toLowerCase()===rawName.toLowerCase()){found=recipes[i];break;}}
  if(found){found.name=rawName;found.p=it.p;found.c=it.c;found.f=it.f;showToast("Recipe updated.");}
  else {recipes.push({id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:rawName,p:it.p,c:it.c,f:it.f});showToast("Recipe saved.");}
  persist();updSidebar();
}
function updSidebar(){
  var last=[],tg=targets();
  for(var i=0;i<5;i++){
    var d=localDay(i),items=(nutri[d]||{}).items||[],tot=totals(items);
    last.push({date:d,items:items,total:tot,score:items.length?scoreOf(tot,tg):null});
  }
  el("sideLast5").innerHTML='<table class="macro5"><thead><tr><th class="l">Day</th><th>P</th><th>C</th><th>F</th></tr></thead><tbody>'+last.map(function(day,idx){
    var label=idx===0?"Today":new Date(day.date+"T00:00").toLocaleDateString(undefined,{weekday:"short"});
    var dateText=new Date(day.date+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
    return '<tr><td class="l macroDate">'+label+'<small>'+dateText+'</small></td>'+(
      day.items.length?'<td>'+Math.round(day.total.p)+'</td><td>'+Math.round(day.total.c)+'</td><td>'+Math.round(day.total.f)+'</td>':'<td class="muted">—</td><td class="muted">—</td><td class="muted">—</td>')+'</tr>';
  }).join("")+'</tbody></table>';
  var logged=last.filter(function(d){return d.items.length;});
  var sum=logged.reduce(function(a,d){a.kcal+=d.total.kcal;a.p+=d.total.p;a.score+=d.score;return a;},{kcal:0,p:0,score:0});
  var n=logged.length;
  el("sideStats").innerHTML='<div class="sideStats">'+
    '<div class="sideStat"><div class="k">Logged days</div><div class="v">'+n+'/5</div></div>'+
    '<div class="sideStat"><div class="k">Avg score</div><div class="v">'+(n?Math.round(sum.score/n):'—')+'</div></div>'+
    '<div class="sideStat"><div class="k">Avg calories</div><div class="v">'+(n?Math.round(sum.kcal/n):'—')+'</div></div>'+
    '<div class="sideStat"><div class="k">Avg protein</div><div class="v">'+(n?Math.round(sum.p/n)+'g':'—')+'</div></div>'+
    '</div><p class="emptyState">Averages use only days containing at least one nutrition entry.</p>';
  el("recipeCount").textContent=recipes.length+(recipes.length===1?" recipe":" recipes");
  var box=el("sideRecipes");
  if(!recipes.length){box.innerHTML='<p class="emptyState">Enter a meal in Today\'s nutrition and tap <b>Save recipe</b>. It will appear here for one-tap logging.</p>';return;}
  var ordered=recipes.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  box.innerHTML=ordered.map(function(r){return '<div class="recipeItem"><div class="recipeTop"><div><div class="recipeName">'+esc(r.name)+'</div><div class="recipeMeta">'+Math.round(kcalOf(r))+' kcal · '+r.p+'P '+r.c+'C '+r.f+'F</div></div><button class="recipeAdd" type="button" data-recipe-add="'+esc(r.id)+'">+ Today</button></div><button class="recipeDelete" type="button" data-recipe-delete="'+esc(r.id)+'">Delete recipe</button></div>';}).join("");
  Array.prototype.forEach.call(box.querySelectorAll("[data-recipe-add]"),function(b){b.onclick=function(){
    var id=b.getAttribute("data-recipe-add"),r=recipes.find(function(x){return x.id===id;});if(r)addToToday(r,r.name+" added to today.");
  };});
  Array.prototype.forEach.call(box.querySelectorAll("[data-recipe-delete]"),function(b){b.onclick=function(){
    var id=b.getAttribute("data-recipe-delete"),r=recipes.find(function(x){return x.id===id;});if(!r)return;
    if(confirm("Delete recipe ‘"+r.name+"’?")){recipes=recipes.filter(function(x){return x.id!==id;});persist();updSidebar();showToast("Recipe deleted.");}
  };});
}

// ---- SVG builders --------------------------------------------------------
function ringSVG(label,pct,color,detail){
  var size=76,st=8,r=(size-st)/2,c=2*Math.PI*r,off=c*(1-Math.min(1,pct||0));
  return '<div class="ring"><svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--grid)" stroke-width="'+st+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+st+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="mono" font-weight="700" font-size="14" fill="var(--navy)">'+Math.round((pct||0)*100)+'%</text>'+
    '</svg><div class="rlab">'+label+'</div><div class="rdet mono">'+detail+'</div></div>';
}
function dialSVG(value){
  var min=0.4,max=0.6,cx=100,cy=104,R=82,sw=14,circ=Math.PI*R;
  var t=value==null?0:clamp((value-min)/(max-min),0,1);
  var good=value!=null&&value<WTHR_TARGET;
  var col=value==null?"var(--faint)":good?"var(--yellow)":"var(--amber)";
  var vcol=value==null?"var(--faint)":good?"var(--navy)":"var(--amber)";
  var arc="M "+(cx-R)+" "+cy+" A "+R+" "+R+" 0 0 1 "+(cx+R)+" "+cy;
  return '<svg viewBox="0 0 200 128" width="100%" style="max-width:230px">'+
    '<path d="'+arc+'" fill="none" stroke="var(--grid)" stroke-width="'+sw+'" stroke-linecap="round"/>'+
    (value!=null?'<path d="'+arc+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-t))+'"/>':'')+
    '<line x1="'+cx+'" y1="'+(cy-R-9)+'" x2="'+cx+'" y2="'+(cy-R+9)+'" stroke="var(--navy)" stroke-width="2.5"/>'+
    '<text x="18" y="122" font-size="9" text-anchor="middle" class="mono" fill="var(--faint)">0.40</text>'+
    '<text x="182" y="122" font-size="9" text-anchor="middle" class="mono" fill="var(--faint)">0.60</text>'+
    '<text x="'+cx+'" y="90" font-size="30" text-anchor="middle" class="mono" font-weight="700" fill="'+vcol+'">'+(value==null?"\u2014":value.toFixed(3))+'</text>'+
    '</svg>';
}
function lineChart(points,color,label,unit,refY){
  var pts=points.filter(function(p){return p.v!=null;});
  if(pts.length<2) return '';
  var W=520,H=132,pl=36,pr=10,pt=10,pb=22;
  var vals=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(refY!=null){mn=Math.min(mn,refY);mx=Math.max(mx,refY);}
  if(mn===mx){mn-=1;mx+=1;}
  var pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
  function X(i){return pl+(i/(pts.length-1))*(W-pl-pr);}
  function Y(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);}
  var path=pts.map(function(p,i){return (i?"L":"M")+" "+X(i).toFixed(1)+" "+Y(p.v).toFixed(1);}).join(" ");
  var dots=pts.map(function(p,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="'+color+'"/>';}).join("");
  var ref=refY!=null?'<line x1="'+pl+'" y1="'+Y(refY).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(refY).toFixed(1)+'" stroke="var(--gold)" stroke-dasharray="4 4"/><text x="'+(W-pr)+'" y="'+(Y(refY)-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--gold)">target</text>':'';
  var yl=[mn,(mn+mx)/2,mx].map(function(v){return '<text x="'+(pl-4)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" text-anchor="end" class="mono" fill="var(--faint)">'+v.toFixed(0)+'</text>';}).join("");
  var xl='<text x="'+X(0)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" class="mono" fill="var(--faint)">'+pts[0].d+'</text><text x="'+X(pts.length-1)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" class="mono" fill="var(--faint)">'+pts[pts.length-1].d+'</text>';
  return '<div class="chline"><span class="chlab">'+label+'</span><span class="chunit mono">'+unit+'</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+ref+yl+xl+'<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>'+dots+'</svg>';
}

// ---- adaptive analysis + proposals --------------------------------------
function deepenOr(m,cw,cur,title,extra){
  var nd=adj.deficit+150, nk=m-nd;
  if(nd<=MAX_DEFICIT && nk>=ABS_FLOOR && cw>WEIGHT_FLOOR+1){
    return {tone:"signal",title:title,body:"Waist isn't moving. Trim ~150 kcal from carbs. "+extra,
      proposal:{action:"deepen",label:"Lower target 150 kcal",detail:"New daily target "+nk+" kcal (down from "+cur+")"}};
  }
  return {tone:"signal",title:"At the safe calorie floor \u2014 don't cut further",
    body:"You're as low as I'd take calories for your size. Don't drop them again \u2014 add a 20\u201330 min conditioning session and hold the current target.",proposal:null};
}
function analyze(){
  var e=sortedMeas(), m=maintenance(), cw=currentWeight(), cur=targets().kcal, isCut=preset==="deficit";
  if(cw<WEIGHT_FLOOR) return {tone:"signal",title:"Under 70 kg \u2014 back to maintenance",
    body:"You've dropped below 70 kg, which is lean for your height. I've set you to Maintenance ("+m+" kcal) to protect the muscle you've built. Keep training hard and let the composition catch up.",proposal:null};
  if(e.length<2) return {tone:"neutral",title:"Log 2\u20133 weeks to unlock guidance",
    body:"The plan adapts off your trend, not a single reading. Keep logging weekly and this panel will tell you exactly what to change \u2014 with a one-tap adjustment when it's warranted.",proposal:null};
  var ww=e.filter(function(x){return x.waist!=null;}), wg=e.filter(function(x){return x.weight!=null;});
  var wa0=ww[0],wa1=ww[ww.length-1],we0=wg[0],we1=wg[wg.length-1];
  var ref0=(wa0||we0).date, ref1=(wa1||we1).date;
  var weeks=Math.max(1,(new Date(ref1)-new Date(ref0))/6048e5);
  var dW=(wa0&&wa1)?wa1.waist-wa0.waist:null;
  var dKg=(we0&&we1)?(we1.weight-we0.weight)/weeks:null;
  var changedRecently=adj.lastChangeDate&&daysBetween(adj.lastChangeDate,today())<14;

  if(dKg!=null&&dKg<-0.45){
    if(isCut) return {tone:"signal",title:"Losing weight too fast \u2014 ease off",
      body:"You're dropping ~"+fmt(Math.abs(dKg))+" kg/week, which risks muscle. Move up to Maintenance \u2014 the waist is the win, not a lower scale number.",
      proposal:{action:"toMaint",label:"Switch to Maintenance",detail:"New daily target "+m+" kcal (up from "+cur+")"}};
    return {tone:"neutral",title:"Weight sliding \u2014 already at maintenance",body:"Hold here and keep protein up. If it keeps falling, nudge calories up a touch.",proposal:null};
  }
  if(dW!=null&&dW<=-0.5) return {tone:"go",title:"On track \u2014 hold the plan",
    body:"Waist down "+fmt(Math.abs(dW))+" cm over ~"+Math.round(weeks)+" week(s). Exactly the curve you want. Don't change anything \u2014 keep eating and training as-is.",proposal:null};
  if(dW!=null&&dW>=0.6){
    if(changedRecently) return {tone:"signal",title:"Waist up \u2014 give the new target time",body:"Trend's the wrong way, but you changed your plan recently. Hold the current target, hit protein, and recheck in a week or two.",proposal:null};
    if(!isCut) return {tone:"signal",title:"Waist creeping up \u2014 start a mild cut",
      body:"You're gaining in the middle at maintenance. A small deficit turns it around.",
      proposal:{action:"toCut",label:"Start mild fat loss",detail:"New daily target "+(m-150)+" kcal (\u2212150, off carbs)"}};
    return deepenOr(m,cw,cur,"Waist creeping up \u2014 tighten a little","Protein first, then carbs.");
  }
  if(weeks>=3&&dW!=null&&Math.abs(dW)<0.5){
    if(changedRecently) return {tone:"neutral",title:"Give the new target ~2 weeks",body:"You adjusted recently. Trends need a couple of weeks to show \u2014 keep logging before changing anything else.",proposal:null};
    if(!isCut) return {tone:"signal",title:"Stalled \u2014 switch to mild fat loss",
      body:"Flat on maintenance is fine for pure recomp, but for a faster belly drop, start a small deficit.",
      proposal:{action:"toCut",label:"Start mild fat loss",detail:"New daily target "+(m-150)+" kcal (\u2212150, off carbs)"}};
    return deepenOr(m,cw,cur,"Stalled ~3 weeks \u2014 nudge it","Or add one 20\u201330 min conditioning session instead.");
  }
  return {tone:"neutral",title:"Steady \u2014 give it another week",body:"Not enough movement yet to act on. Trends need 3\u20134 weeks to read clearly. Keep logging.",proposal:null};
}

// ---- updates -------------------------------------------------------------
function updTargets(){
  var tg=targets();
  el("segR").className=preset==="recomp"?"on":"";
  el("segD").className=preset==="deficit"?"on":"";
  el("tgKcal").textContent=tg.kcal;
  el("tgLabel").textContent="kcal \u00b7 "+tg.label;
  el("tgMaint").textContent="Maintenance ~"+tg.maint+" kcal \u00b7 tracks your current "+fmt(currentWeight())+" kg";
  el("tgBlurb").textContent=tg.blurb;
  var rows=[["Protein",tg.p,tg.p*4,"var(--navy)","the priority"],
    ["Carbs",tg.c,tg.c*4,"var(--steel)","training fuel \u00b7 the lever you adjust"],
    ["Fat",tg.f,tg.f*9,"var(--amber)","hormonal floor \u2014 don't go lower"]];
  el("tgBars").innerHTML=rows.map(function(r){var pc=Math.round(r[2]/tg.kcal*100);
    return '<div class="barrow"><div class="row"><span style="font-weight:600;font-size:14px">'+r[0]+'</span>'+
      '<span class="mono sm">'+r[1]+' g <span class="muted">\u00b7 '+pc+'%</span></span></div>'+
      '<div class="bartrack"><div class="barfill" style="width:'+pc+'%;background:'+r[3]+'"></div></div>'+
      '<div class="xs muted" style="margin-top:3px">'+r[4]+'</div></div>';}).join("");
}
function updNutrition(){
  var tg=targets(), items=(nutri[today()]||{}).items||[], tot=totals(items);
  var sc=items.length?scoreOf(tot,tg):null;
  el("todayDate").textContent=new Date(today()+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" \u00b7 resets at midnight";
  el("nutriSub").innerHTML='Targets from your <b style="color:var(--navy)">'+esc(tg.label)+'</b> plan. Log meals through the day; the rings fill as you go.';
  var sN=el("scoreN"); sN.textContent=sc==null?"\u2014":sc; sN.style.color=sc==null?"var(--faint)":(sc>=75?"var(--navy)":"var(--amber)");
  // 7 day avg
  var last7=[]; for(var i=0;i<7;i++){var d=localDay(i);var it=(nutri[d]||{}).items||[];if(it.length)last7.push(scoreOf(totals(it),tg));}
  el("avg7").textContent=last7.length?("7-day avg "+Math.round(last7.reduce(function(a,b){return a+b;},0)/last7.length)):"";
  var calPct=tot.kcal/tg.kcal, calCol=calPct>1.05?"var(--amber)":"var(--yellow)";
  el("rings").innerHTML=ringSVG("Calories",calPct,calCol,Math.round(tot.kcal)+" / "+tg.kcal)+
    ringSVG("Protein",tot.p/tg.p,"var(--navy)",Math.round(tot.p)+" / "+tg.p+" g")+
    ringSVG("Carbs",tot.c/tg.c,"var(--steel)",Math.round(tot.c)+" / "+tg.c+" g")+
    ringSVG("Fat",tot.f/tg.f,"var(--amber)",Math.round(tot.f)+" / "+tg.f+" g");
  // list
  var lst=el("todayList");
  if(items.length){
    lst.innerHTML=items.map(function(it,i){return '<div class="li"><span style="font-weight:500">'+esc(it.name)+'</span>'+
      '<span class="mono xs muted">'+Math.round(kcalOf(it))+'kcal \u00b7 '+it.p+'p '+it.c+'c '+it.f+'f<button class="x" data-i="'+i+'">\u00d7</button></span></div>';}).join("")+
      '<button class="link" id="clrToday" style="margin-top:8px">Clear today</button>';
    Array.prototype.forEach.call(lst.querySelectorAll(".x"),function(b){b.onclick=function(){
      var i=+b.getAttribute("data-i"); var t=today(); nutri[t].items.splice(i,1); persist(); updNutrition();};});
    el("clrToday").onclick=function(){if(confirm("Clear everything logged today?")){nutri[today()]={items:[]};persist();updNutrition();}};
  } else { lst.innerHTML='<p class="xs muted">Nothing logged yet today. Add a meal above, or tap a quick-add.</p>'; }
  // strip
  var cells=""; var count=0;
  for(var j=13;j>=0;j--){var dd=localDay(j);var it2=(nutri[dd]||{}).items||[];var s=it2.length?scoreOf(totals(it2),tg):null;if(s!=null)count++;
    var col=s==null?"var(--grid)":s>=80?"var(--yellow)":s>=55?"var(--amber)":"var(--line)";
    var border=dd===today()?"border:2px solid var(--navy)":"";
    cells+='<div class="cell" title="'+dd+': '+(s==null?"no log":s)+'"><div class="cellbar" style="background:'+col+';'+border+'"></div><div class="celld">'+dd.slice(8)+'</div></div>';}
  el("strip").innerHTML=cells; el("stripCount").textContent=count+" logged";
  updSidebar();
}
function updDial(){
  var e=sortedMeas(), latest=e[e.length-1]||null;
  var wv=latest&&latest.waist!=null?latest.waist/HEIGHT:null;
  el("dial").innerHTML=dialSVG(wv);
  var good=wv!=null&&wv<WTHR_TARGET;
  var st=el("dialStatus");
  st.textContent=wv==null?"Log a waist measurement":good?"In the healthy zone":"Above target \u2014 keep going";
  st.style.color=wv==null?"var(--faint)":good?"var(--navy)":"var(--amber)";
  el("stWaist").textContent=(latest&&latest.waist!=null)?fmt(latest.waist)+" cm":"\u2014";
  el("stTo").textContent=(latest&&latest.waist!=null)?fmt(latest.waist-HEIGHT*WTHR_TARGET)+" cm":"\u2014";
}
var pendingProposal=null;
function updAnalysis(){
  var g=analyze();
  var card=el("guidCard");
  card.style.background=g.tone==="go"?"var(--yellowSoft)":g.tone==="signal"?"var(--amberSoft)":"var(--card)";
  card.style.borderColor=g.tone==="go"?"var(--yellow)":g.tone==="signal"?"var(--amber)":"var(--line)";
  el("guidDot").style.background=g.tone==="go"?"var(--yellow)":g.tone==="signal"?"var(--amber)":"var(--faint)";
  var tt=el("guidTitle"); tt.textContent=g.title; tt.style.color=g.tone==="signal"?"var(--amber)":"var(--navy)";
  el("guidBody").textContent=g.body;
  pendingProposal=g.proposal||null;
  var pb=el("proposalBox");
  if(g.proposal){pb.className=""; el("propDetail").textContent=g.proposal.detail; el("applyBtn").textContent=g.proposal.label;}
  else pb.className="hide";
  var e=sortedMeas(); var tn=el("guidTrain");
  if(e.length){var wk=Math.floor((Date.now()-new Date(e[0].date))/6048e5);var due=wk>0&&wk%4===0;
    tn.style.display="";
    tn.textContent="Training \u00b7 week "+wk+", block "+(Math.floor(wk/4)+1)+". "+(due?"4-week mark: add load or reps to your main lifts, or rotate in a new variation this block.":"Progress something small each session (a rep, a little weight). Re-jig exercises every 4 weeks.");
  } else tn.style.display="none";
}
function applyProposal(){
  if(!pendingProposal) return;
  var a=pendingProposal.action;
  if(a==="toMaint"){preset="recomp";}
  else if(a==="toCut"){preset="deficit"; adj.deficit=150;}
  else if(a==="deepen"){preset="deficit"; adj.deficit=Math.min(adj.deficit+150,MAX_DEFICIT);}
  adj.lastChangeDate=today(); persist(); updAll();
}
function updCharts(){
  var e=sortedMeas();
  if(e.length<2){el("chartCard").className="card hide";return;}
  el("chartCard").className="card";
  var w=e.map(function(x){return {d:x.date.slice(5),v:x.waist!=null?x.waist:null};});
  var kg=e.map(function(x){return {d:x.date.slice(5),v:x.weight!=null?x.weight:null};});
  el("charts").innerHTML=lineChart(w,"var(--navy)","Waist","cm",HEIGHT*WTHR_TARGET)+
    '<div style="height:10px"></div>'+lineChart(kg,"var(--steel)","Weight","kg",null);
}
function updHistory(){
  var e=sortedMeas();
  if(!e.length){el("histCard").className="card hide";return;}
  el("histCard").className="card";
  var head='<tr><th class="l">Date</th>'+FIELDS.map(function(f){return '<th>'+f.l+'</th>';}).join("")+'<th></th></tr>';
  var rows=e.slice().reverse().map(function(x){
    return '<tr><td class="l">'+x.date.slice(5)+'</td>'+FIELDS.map(function(f){return '<td>'+fmt(x[f.k])+'</td>';}).join("")+
      '<td><button class="x" data-d="'+x.date+'">\u00d7</button></td></tr>';}).join("");
  var t=el("histTable"); t.innerHTML='<table>'+head+rows+'</table>';
  Array.prototype.forEach.call(t.querySelectorAll(".x"),function(b){b.onclick=function(){
    var d=b.getAttribute("data-d"); meas=meas.filter(function(m){return m.date!==d;}); persist(); updAll();};});
}
function enforceSafety(){ if(currentWeight()<WEIGHT_FLOOR && preset==="deficit"){preset="recomp"; persist();} }
function updAll(){enforceSafety();updTargets();updNutrition();updDial();updAnalysis();updCharts();updHistory();}

// ---- events --------------------------------------------------------------
function wire(){
  el("chips").innerHTML=QUICK.map(function(q,i){return '<button class="pill" data-i="'+i+'">+ '+esc(q.name)+'</button>';}).join("");
  Array.prototype.forEach.call(el("chips").querySelectorAll(".pill"),function(b){b.onclick=function(){
    var q=QUICK[+b.getAttribute("data-i")];addToToday(q);};});
  el("addFood").onclick=function(){
    var it=foodFromInputs();if(!it.p&&!it.c&&!it.f)return;addToToday(it);clearFoodInputs();};
  el("saveRecipe").onclick=function(){saveRecipeFromForm();};
  el("menuBtn").onclick=function(){openDrawer();};
  el("drawerClose").onclick=function(){closeDrawer();};
  el("drawerOverlay").onclick=function(){closeDrawer();};
  document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeDrawer();});
  el("segR").onclick=function(){preset="recomp";persist();updAll();};
  el("segD").onclick=function(){preset="deficit";adj.deficit=150;adj.lastChangeDate=today();persist();updAll();};
  el("applyBtn").onclick=function(){applyProposal();};
  el("mDate").value=today();
  el("saveMeas").onclick=function(){
    var d=el("mDate").value||today(); var row={date:d,notes:el("mNotes").value||""};
    var any=false; FIELDS.forEach(function(f){var v=el("m_"+f.k).value; row[f.k]=v===""?null:+v; if(v!=="")any=true;});
    if(!any) return;
    meas=meas.filter(function(m){return m.date!==d;}); meas.push(row); persist();
    FIELDS.forEach(function(f){el("m_"+f.k).value="";}); el("mNotes").value="";
    updAll();};
  el("clearMeas").onclick=function(){if(confirm("Delete all logged measurements? This can't be undone.")){meas=[];persist();updAll();}};
  el("expBtn").onclick=function(){
    var blob=new Blob([JSON.stringify({v:2,exportedAt:new Date().toISOString(),preset:preset,adj:adj,meas:meas,nutri:nutri,recipes:recipes},null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="recomp-backup-"+today()+".json"; a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);};
  el("impBtn").onclick=function(){el("impFile").click();};
  el("impFile").onchange=function(ev){
    var file=ev.target.files[0]; if(!file) return; var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);
      if(!confirm("Replace current data with this backup?")) return;
      meas=o.meas||[]; nutri=o.nutri||{}; preset=o.preset||preset; adj=o.adj||adj; if(Array.isArray(o.recipes))recipes=normaliseRecipes(o.recipes); persist(); updAll();
      el("mDate").value=today(); alert("Backup restored.");
    }catch(e){alert("Couldn't read that file \u2014 make sure it's a Recomp backup.");}};
    rd.readAsText(file); ev.target.value="";};
}

buildUI(); wire(); updAll();
